name: C component quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - name: Read fixed shared tool source
        id: quality
        env:
          QUALITY_REPOSITORY: ${{ vars.XGEN_QUALITY_REPOSITORY || 'X-Gen-Lab/xgen-quality' }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          repository = os.environ['QUALITY_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('Set XGEN_QUALITY_REPOSITORY to the published, readable tool repository.')
          config = json.loads(Path('tools/quality.json').read_text('utf-8'))
          revision = config['quality_source']['revision']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Pin a full quality source commit in tools/quality.json.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'revision={revision}\n')
          PY
      - name: Fetch fixed shared quality source explicitly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY || 'X-Gen-Lab/xgen-quality' }}
          ref: ${{ steps.quality.outputs.revision }}
          path: out/deps/quality-source
          persist-credentials: false
      - name: Prepare pinned Python tools
        run: python -m pip install ./out/deps/quality-source
      - name: Fetch fixed GoogleTest source explicitly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google/googletest
          ref: ff6133ab49b364a883a55ba75c39e520fea6245b
          path: out/deps/gtest-src
      - name: Build test dependency
        run: |
          cmake -S out/deps/gtest-src -B out/deps/gtest-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/out/deps/gtest" -DBUILD_GMOCK=OFF -DINSTALL_GTEST=ON -Dgtest_force_shared_crt=ON
          cmake --build out/deps/gtest-build --parallel 2
          cmake --install out/deps/gtest-build
      - name: Text and C/C++ format
        run: |
          python tools/quality.py text
          python tools/quality.py format
          python -m pre_commit run --all-files
      - name: Build and test real component
        run: |
          cmake --preset host
          cmake --build --preset host --parallel 2
          python tools/quality.py test --build-dir out/host
      - name: Pure C production build
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
      - name: Fetch fixed Cppcheck source explicitly
        if: runner.os == 'Linux'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: danmar/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b
          path: out/deps/cppcheck-src
      - name: Fetch fixed Doxygen source explicitly
        if: runner.os == 'Linux'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: doxygen/doxygen
          ref: 0128237a63c2ca9ca4c8d772d0cee9e8e5415835
          path: out/deps/doxygen-src
      - name: Prepare fixed native analyzers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison
          cmake -S out/deps/cppcheck-src -B out/deps/cppcheck-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/out/deps/cppcheck" -DBUILD_GUI=OFF -DBUILD_TESTING=OFF
          cmake --build out/deps/cppcheck-build --parallel 2
          cmake --install out/deps/cppcheck-build
          cmake -S out/deps/doxygen-src -B out/deps/doxygen-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/deps/doxygen-build --target doxygen --parallel 2
      - name: Static analysis and public API documentation
        if: runner.os == 'Linux'
        env:
          XGEN_CPPCHECK: ${{ github.workspace }}/out/deps/cppcheck/bin/cppcheck
          XGEN_DOXYGEN: ${{ github.workspace }}/out/deps/doxygen-build/bin/doxygen
        run: |
          python tools/quality.py cppcheck --build-dir out/host
          python tools/quality.py tidy --build-dir out/host
          python tools/quality.py docs
      - name: Production coverage
        if: runner.os == 'Linux'
        run: |
          cmake --preset coverage
          cmake --build --preset coverage --parallel 2
          python tools/quality.py test --build-dir out/coverage
          python tools/quality.py coverage --build-dir out/coverage
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-reports-${{ matrix.os }}
          path: |
            out/reports/
            out/host/Testing/
            out/coverage/Testing/
          if-no-files-found: warn

  status:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
