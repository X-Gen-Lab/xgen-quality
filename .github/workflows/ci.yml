name: Shared quality package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Explicitly prepare pinned backend and dependency wheels
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', *project['build-system']['requires']], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', *project['project']['optional-dependencies']['dev']], check=True)
          PY
          python -m pip wheel --no-build-isolation --wheel-dir out/wheelhouse .
      - name: Install the built package and fixed dependencies offline
        run: python -m pip install --no-index --find-links out/wheelhouse out/wheelhouse/xgen_quality-0.1.0-py3-none-any.whl
      - name: Validate dependencies and installed entry point
        run: |
          python -m pip check
          python -m xgen_quality --root . text
          python -m pre_commit run --all-files
      - name: Unit and isolated wheel-consumer tests
        run: |
          mkdir -p out/reports
          python -m coverage run --branch --source=src/xgen_quality -m unittest discover -s tests -v 2>&1 | tee out/reports/python-tests.txt
          python -m coverage report -m
          python -m coverage json -o out/reports/python-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          totals = json.loads(Path('out/reports/python-coverage.json').read_text('utf-8'))['totals']
          for covered, total in [('covered_lines', 'num_statements'), ('covered_branches', 'num_branches')]:
              if totals[total] <= 0 or 100 * totals[covered] / totals[total] < 80:
                  raise SystemExit(f'{covered} below the separate 80% gate: {totals}')
          PY
      - name: Preserve test evidence and package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.os }}
          path: |
            out/reports/
            out/wheelhouse/xgen_quality-*.whl
          if-no-files-found: error
